<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimic Demo Sandbox</title>
<meta name="description" content="Click around Mimic and a guild site as if you were signed in, with sample data from a real raid and every name invented.">
<!-- Demo layout B (the sandbox). Not indexed until the guild lead picks a layout. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../mimic-logo.png">
<link rel="stylesheet" href="../demo.css">
<style>
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1260px;margin:0 auto;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow-y:auto}
.side .grp{color:var(--faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:14px 8px 4px}
.side .grp:first-child{margin-top:0}
.side a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;color:var(--dim);text-decoration:none;border-left:2px solid transparent}
.side a:hover{color:var(--text)}
.side a[aria-current="page"]{color:var(--text);background:var(--panel);border-left-color:var(--gold)}
.side .tag{font-size:10px;color:var(--orange)}
.main{padding:18px 20px 40px;min-width:0}
.main h1{font-size:20px;margin-bottom:4px}
.main .lede{color:var(--dim);margin:0 0 14px;max-width:780px}
.who{font-size:12px;color:var(--dim)}
.guildflag{font-size:11px;color:var(--orange);border:1px solid rgba(255,166,87,.5);border-radius:4px;padding:0 6px}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--border);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
  .side .grp{display:none}
  .side a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:0}
  .side a[aria-current="page"]{border-bottom-color:var(--gold);background:none}
  .side .tag{display:none}
  .main{padding:14px 16px 32px}
}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <a class="brand" href="../../"><img src="../../mimic-logo.png" alt=""><b>mimic</b></a>
  <span class="pill demo">sample data</span>
  <span class="who">Lantern Watch · signed in as <b id="me"></b></span>
  <span class="links"><a href="../">Take the tour →</a><a href="../../">Download</a></span>
</div></div>

<div class="shell">
  <nav class="side" aria-label="Demo pages">
    <div class="grp">On your screen</div>
    <a href="#overlays">Overlays</a>
    <a href="#mimic">Control panel</a>
    <div class="grp">Guild site</div>
    <a href="#night">Raid night <span class="tag">guild</span></a>
    <a href="#parse/f3">Parses <span class="tag">guild</span></a>
    <div class="grp">Officers</div>
    <a href="#triggers">Triggers <span class="tag">guild</span></a>
    <a href="#attendance">Attendance <span class="tag">guild</span></a>
    <a href="#loot">Loot and DKP <span class="tag">guild</span></a>
    <a href="#members">Members <span class="tag">guild</span></a>
    <a href="#feedback">Bugs and ideas <span class="tag">guild</span></a>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>window.DEMO_ROOT = '../../';</script>
<script src="../data.js"></script>
<script src="../panels.js"></script>
<script>
(function () {
  var P = window.DemoPanels, D = P.data, main = document.getElementById('main');
  document.getElementById('me').textContent = D.you;
  var GUILD = ' <span class="guildflag">needs your guild\'s server</span>';
  var pages = {
    overlays: { title: 'Overlays', lede: 'What sits over the game during a fight. This replays a real seven-minute boss fight; every name is invented.', run: function (h) { P.scene(h); } },
    mimic: { title: 'Control panel', lede: 'Mimic\'s own window on your PC. In local mode nothing here leaves your machine. Try the tabs and switches.', run: function (h) { P.dashboard(h); } },
    night: { title: 'Ssraeshza Temple', guild: true, lede: 'The raid night at a glance. Click a boss for its parse.', run: function (h) { P.night(h, function (id) { location.hash = 'parse/' + id; }); } },
    parse: { title: 'Parse', guild: true, lede: 'Every raider\'s damage on one boss, merged from everyone\'s logs.', run: function (h, arg) {
      h.innerHTML = '<p><select id="pick" aria-label="Pick a fight">' + P.fightOptions(arg) + '</select></p><div class="panel"><div id="pp"></div></div>';
      P.parse(document.getElementById('pp'), arg);
      document.getElementById('pick').addEventListener('change', function () { location.hash = 'parse/' + this.value; });
    } },
    triggers: { title: 'Guild triggers', guild: true, lede: 'The raid\'s shared callouts. Switch one off and every raider\'s Mimic follows within a couple of minutes.', run: function (h) { P.triggersAdmin(h); } },
    attendance: { title: 'Attendance', guild: true, lede: 'Who raided, night by night.', run: function (h) { P.attendance(h); } },
    loot: { title: 'Loot and DKP', guild: true, lede: 'The night\'s drops, who won them, and where everyone stands.', run: function (h) { P.loot(h); } },
    members: { title: 'Members', guild: true, lede: 'The roster, and who is on which Mimic, so officers know who will hear tonight\'s new callout.', run: function (h) { P.members(h); } },
    feedback: { title: 'Bugs and ideas', guild: true, lede: 'What the raid has reported, and where each one stands.', run: function (h) { P.feedback(h); } },
  };
  function route() {
    var parts = (location.hash.replace(/^#/, '') || 'overlays').split('/');
    var key = pages[parts[0]] ? parts[0] : 'overlays', pg = pages[key];
    document.querySelectorAll('.side a').forEach(function (a) {
      a.setAttribute('aria-current', a.getAttribute('href').replace(/^#/, '').split('/')[0] === key ? 'page' : 'false');
    });
    main.innerHTML = '<h1>' + pg.title + (pg.guild ? GUILD : '') + '</h1><p class="lede">' + pg.lede + '</p><div id="host"></div>';
    var host = document.getElementById('host');
    if (key !== 'parse' && key !== 'overlays' && key !== 'mimic') { host.className = 'panel'; }
    pg.run(host, parts[1] || 'f3');
    document.title = pg.title + ' · Mimic Demo Sandbox';
  }
  window.addEventListener('hashchange', function () { route(); main.focus({ preventScroll: true }); window.scrollTo(0, 0); });
  route();
})();
</script>
</body>
</html>
